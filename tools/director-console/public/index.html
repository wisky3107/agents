<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Director Console</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #1d2330; --muted: #667085; --line: #e3e6eb;
  --accent: #2f6fde; --accent-ink: #ffffff; --ok: #1f8a4c; --warn: #b26a00; --bad: #c0392b;
  --chip: #eef1f5; --code: #f2f4f7; --shadow: 0 1px 2px rgba(16, 24, 40, .06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1218; --panel: #171b23; --ink: #e6e9ef; --muted: #98a2b3; --line: #2a303b;
    --accent: #5b8ff0; --accent-ink: #0b0e13; --ok: #4cc08a; --warn: #e3a44b; --bad: #ef6b5b;
    --chip: #222834; --code: #1e232d; --shadow: none;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
header { position: sticky; top: 0; z-index: 2; background: var(--panel); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 16px; padding: 10px 16px; flex-wrap: wrap; }
header h1 { font-size: 15px; margin: 0; font-weight: 650; }
nav { display: flex; gap: 4px; flex-wrap: wrap; }
nav button { border: 0; background: none; color: var(--muted); padding: 6px 10px; border-radius: 6px; cursor: pointer; font: inherit; }
nav button.on { background: var(--chip); color: var(--ink); font-weight: 600; }
nav .badge { margin-left: 6px; }
#status { margin-left: auto; color: var(--muted); font-size: 12px; }
main { max-width: 1240px; margin: 0 auto; padding: 16px; }
section.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 14px; box-shadow: var(--shadow); }
section.panel > h2 { font-size: 14px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.chip { display: inline-block; background: var(--chip); border-radius: 999px; padding: 1px 8px; font-size: 12px; white-space: nowrap; }
.chip.ok { color: var(--ok); } .chip.warn { color: var(--warn); } .chip.bad { color: var(--bad); }
.badge { display: inline-block; min-width: 18px; text-align: center; background: var(--bad); color: #fff; border-radius: 999px; font-size: 11px; padding: 0 5px; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; color: var(--muted); font-weight: 600; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--chip); }
.mono, pre, code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
pre { background: var(--code); padding: 10px; border-radius: 8px; white-space: pre-wrap; word-break: break-word; max-height: 420px; overflow: auto; margin: 8px 0; }
.card { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin: 8px 0; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; min-width: 160px; }
button.act, a.act { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 6px; padding: 5px 10px; cursor: pointer; font: inherit; text-decoration: none; }
button.act:hover { border-color: var(--accent); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button:disabled { opacity: .5; cursor: default; }
input, select, textarea { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
textarea { width: 100%; min-height: 54px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 14px; }
.stat { display: inline-flex; flex-direction: column; margin-right: 22px; }
.stat b { font-size: 20px; }
.empty { color: var(--muted); padding: 6px 0; }
.toast { position: fixed; right: 16px; bottom: 16px; max-width: 520px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; box-shadow: 0 6px 24px rgba(0,0,0,.18); white-space: pre-wrap; font-size: 12px; }
.toast.bad { border-color: var(--bad); }
details summary { cursor: pointer; color: var(--muted); }
iframe { width: 100%; height: 78vh; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
@media (max-width: 640px) { main { padding: 10px; } th:nth-child(n+5), td:nth-child(n+5) { display: none; } }
</style>
</head>
<body>
<header>
  <h1>Director Console</h1>
  <nav id="tabs"></nav>
  <span id="status">…</span>
</header>
<main id="main"></main>
<script>
'use strict';
// ------------------------------------------------------------------ plumbing
const T = (() => {
  const q = new URLSearchParams(location.search).get('t');
  try { if (q) { sessionStorage.setItem('console-token', q); history.replaceState(null, '', location.pathname + location.hash); } } catch {}
  try { return q || sessionStorage.getItem('console-token') || ''; } catch { return q || ''; }
})();
const api = async (url) => {
  const r = await fetch(url, { headers: { 'x-console-token': T } });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.status);
  return j;
};
const act = async (name, body, confirmText) => {
  if (confirmText && !confirm(confirmText)) return null;
  const r = await fetch(`/api/action/${name}`, { method: 'POST', headers: { 'x-console-token': T, 'content-type': 'application/json' }, body: JSON.stringify(body) });
  const j = await r.json();
  const ok = r.ok && j.ok;
  toast(`${name}: ${ok ? 'xong' : 'lỗi'}\n${typeof j.out === 'string' ? j.out : JSON.stringify(j.out ?? j.error, null, 1)}${j.err ? '\n' + j.err : ''}`.slice(0, 1200), !ok);
  await render();
  return j;
};
function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'class') el.className = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  return el;
}
const panel = (title, ...kids) => h('section', { class: 'panel' }, h('h2', {}, title), ...kids);
const chip = (text, cls = '') => h('span', { class: `chip ${cls}` }, text);
const empty = (text) => h('div', { class: 'empty' }, text);
const when = (iso) => (iso ? new Date(iso).toLocaleString('vi-VN', { hour12: false }) : '—');
const table = (head, rows) => h('table', {}, h('thead', {}, h('tr', {}, head.map((x) => h('th', {}, x)))), h('tbody', {}, rows));
function toast(text, bad) {
  document.querySelectorAll('.toast').forEach((t) => t.remove());
  const t = h('div', { class: `toast ${bad ? 'bad' : ''}`, onclick: () => t.remove() }, text);
  document.body.append(t);
  setTimeout(() => t.remove(), bad ? 20000 : 7000);
}
const modeCls = (m) => (m === 'assist' ? 'ok' : m === 'shadow' ? 'warn' : '');

// ------------------------------------------------------------------ tabs
const TABS = [['pending', 'Chờ duyệt'], ['workflow', 'Workflow'], ['memory', 'Memory'], ['pilot', 'Pilot'], ['playbook', 'Playbook'], ['scorecard', 'Scorecard'], ['log', 'Nhật ký']];
const fromHash = () => {
  const [t, id] = (location.hash || '#pending').slice(1).split('/');
  tab = TABS.some(([x]) => x === t) ? t : 'pending';
  if (t === 'workflow') state.project = id ? decodeURIComponent(id) : null;
};
let tab = 'pending';
let overview = null;
const state = { project: null, pilotProject: null, recordQ: '', recordProject: '', record: null, recipeQ: '', recipe: null };
fromHash();

function drawTabs() {
  const nav = document.getElementById('tabs');
  nav.replaceChildren(...TABS.map(([id, label]) => {
    const n = id === 'pending' && overview ? countPending(overview.pending) : 0;
    return h('button', { class: tab === id ? 'on' : '', onclick: () => { location.hash = id; } }, label, n ? h('span', { class: 'badge' }, n) : null);
  }));
}
const countPending = (p) => p.questions.length + p.drafts.length + p.triage.length + (p.refresh && (!p.refresh.ok || p.refresh.stale) ? 1 : 0);

async function render() {
  const main = document.getElementById('main');
  try {
    overview = await api('/api/overview');
    document.getElementById('status').textContent = `cập nhật ${when(overview.at)}`;
    drawTabs();
    const view = await VIEWS[tab]?.();
    main.replaceChildren(...[view].flat());
  } catch (e) {
    document.getElementById('status').textContent = 'lỗi';
    main.replaceChildren(panel('Không tải được', h('pre', {}, String(e.message)), e.message === 'token' ? h('p', {}, 'Mở lại đúng URL server in ra (có ?t=…).') : null));
  }
}

// ------------------------------------------------------------------ views
const VIEWS = {
  async pending() {
    const p = overview.pending;
    const out = [];
    out.push(panel(['Câu hỏi của runner ', chip(p.questions.length)], p.questions.length ? p.questions.map(questionCard) : empty('Không có câu hỏi nào đang chờ.')));
    out.push(panel(['Bảng nháp verdict ', chip(p.drafts.length)], p.drafts.length ? p.drafts.map(draftCard) : empty('Không có bảng nháp nào. Drafter chạy 09:41 hằng ngày cho slice đã merge.')));
    const rf = p.refresh;
    out.push(panel('Kho memory', h('div', { class: 'row' },
      rf ? chip(`refresh ${rf.ok ? 'ok' : 'LỖI ở ' + rf.failed_step} · ${when(rf.at)}${rf.stale ? ' · cũ >48h' : ''}`, rf.ok && !rf.stale ? 'ok' : 'bad') : chip('chưa refresh lần nào', 'bad'),
      h('button', { class: 'act', onclick: () => act('memory.refresh', {}, 'Chạy refresh (backup → normalize → verify → rebuild-index)?') }, 'Chạy refresh ngay')),
      h('h2', { style: 'margin-top:12px' }, 'Triage ', chip(p.triage.length)),
      p.triage.length ? p.triage.map(triageCard) : empty('Không có dòng triage nào.')));
    if (p.unregistered.length) out.push(panel('Dự án chưa đăng ký memory', table(['Đường dẫn', 'Task', 'Gần nhất', 'Lệnh'], p.unregistered.map((u) =>
      h('tr', {}, h('td', { class: 'mono' }, u.path), h('td', {}, u.tasks), h('td', {}, when(u.last_task_at)), h('td', { class: 'mono small' }, `orca-memory register --path ${u.path} --domain cocos --data-owner <owner>`))))));
    const byProject = {};
    for (const d of p.manual_deferred) (byProject[d.project] ??= []).push(d);
    out.push(panel(['Check thủ công bị hoãn tới release ', chip(p.manual_deferred.reduce((n, d) => n + d.items.length, 0))],
      h('p', { class: 'muted small' }, 'Các check agent không tự làm được (thiết bị thật, cảm giác thời gian thực…), để director kiểm tra trước khi release.'),
      Object.keys(byProject).length ? Object.entries(byProject).map(([proj, ds]) => h('details', { style: 'margin:6px 0' },
        h('summary', {}, `${proj}: ${ds.reduce((n, d) => n + d.items.length, 0)} việc trên ${ds.length} slice`),
        table(['Slice', 'Việc cần kiểm tra tay'], ds.map((d) => h('tr', {}, h('td', {}, d.slice), h('td', {}, h('ul', { style: 'margin:0;padding-left:18px' }, d.items.map((i) => h('li', {}, i))))))))) : empty('Không có.')));
    return out;
  },

  async workflow() {
    const rows = overview.projects.map((p) => h('tr', { class: 'click', onclick: () => { location.hash = `workflow/${encodeURIComponent(p.id)}`; } },
      h('td', {}, h('b', {}, p.id)),
      h('td', {}, p.mode ? chip(p.mode, modeCls(p.mode)) : chip('chưa đăng ký', 'bad')),
      h('td', {}, p.runner ? `${p.runner.slice ?? '—'} · ${p.runner.step ?? '—'}` : h('span', { class: 'muted' }, 'không dùng runner')),
      h('td', {}, p.runner ? chip(p.runner.alive ? 'đang chạy' : 'dừng', p.runner.alive ? 'ok' : '') : ''),
      h('td', {}, p.runner?.control ? chip(`${p.runner.control.cmd}${p.runner.control.arg ? ' ' + p.runner.control.arg : ''}`, 'warn') : ''),
      h('td', {}, p.runner?.open_questions ? h('span', { class: 'badge' }, p.runner.open_questions) : '')));
    const out = [panel('Dự án', table(['Dự án', 'Memory', 'Runner', 'Trạng thái', 'Điều khiển', 'Hỏi'], rows))];
    if (state.project) out.push(await projectView(state.project));
    return out;
  },

  async memory() {
    const m = await api('/api/memory');
    const out = [];
    out.push(panel('Mode của từng dự án', table(['Dự án', 'Mode', 'Đổi mode', ''], m.modes.map((p) => {
      const sel = h('select', {}, ['off', 'capture-only', 'shadow', 'assist'].map((x) => h('option', { value: x, selected: x === p.mode }, x)));
      const note = h('input', { placeholder: 'lý do (bắt buộc)', class: 'grow' });
      return h('tr', {}, h('td', {}, h('b', {}, p.id), h('div', { class: 'muted small' }, p.notes ?? '')), h('td', {}, chip(p.mode, modeCls(p.mode))),
        h('td', {}, h('div', { class: 'row' }, sel, note)),
        h('td', {}, h('button', { class: 'act', onclick: () => act('memory.mode', { project: p.id, mode: sel.value, note: note.value }, `Đổi ${p.id}: ${p.mode} → ${sel.value}?${sel.value === 'assist' ? '\nPack sẽ đi thẳng vào agent.' : ''}`) }, 'Áp dụng')));
    }))));
    const a = m.archive;
    out.push(panel('Kho bài học', h('div', {}, h('span', { class: 'stat' }, h('b', {}, a.records), h('span', { class: 'muted small' }, 'record')),
      ...Object.entries(a.by_lifecycle).map(([k, v]) => h('span', { class: 'stat' }, h('b', {}, v), h('span', { class: 'muted small' }, k)))),
      h('div', { class: 'row', style: 'margin-top:8px' }, Object.entries(a.by_project).map(([k, v]) => chip(`${k}: ${v}`))),
      h('div', { class: 'row', style: 'margin-top:6px' }, Object.entries(a.by_kind).map(([k, v]) => chip(`${k}: ${v}`))),
      h('details', { style: 'margin-top:8px' }, h('summary', {}, 'Lịch sử refresh'), table(['Lúc', 'OK', 'Record', 'Mới', 'Triage'], m.refresh_log.map((r) => h('tr', {}, h('td', {}, when(r.at)), h('td', {}, r.ok ? '✓' : `✗ ${r.failed_step}`), h('td', {}, r.records ?? '—'), h('td', {}, r.created ?? '—'), h('td', {}, r.triage_open)))))));
    out.push(await recordsPanel());
    out.push(h('div', { class: 'grid2' },
      panel('Hook gần đây', table(['Lúc', 'Dự án / task', 'Stage', 'Mode', 'Trạng thái', 'Item'], m.hook_log.map((r) => h('tr', {}, h('td', { class: 'small' }, when(r.at)), h('td', {}, `${r.project ?? '—'} / ${r.task ?? '—'}`), h('td', {}, r.stage), h('td', {}, r.mode ?? '—'), h('td', {}, chip(r.status, r.inject ? 'ok' : '')), h('td', {}, r.items ?? ''))))),
      panel('Lịch sử đổi mode', m.mode_log.length ? table(['Lúc', 'Dự án', 'Đổi', 'Lý do'], m.mode_log.map((r) => h('tr', {}, h('td', { class: 'small' }, when(r.at)), h('td', {}, r.project), h('td', {}, `${r.from} → ${r.to}`), h('td', { class: 'small' }, r.note)))) : empty('Chưa có.'))));
    return out;
  },

  async pilot() {
    const reg = overview.projects.filter((p) => p.registered);
    state.pilotProject ??= reg.find((p) => p.mode === 'assist')?.id ?? reg[0]?.id;
    const sel = h('select', { onchange: (e) => { state.pilotProject = e.target.value; render(); } }, reg.map((p) => h('option', { value: p.id, selected: p.id === state.pilotProject }, p.id)));
    const out = [panel('Dự án', sel)];
    if (!state.pilotProject) return out;
    let r;
    try { r = await api(`/api/pilot?project=${encodeURIComponent(state.pilotProject)}`); } catch (e) { out.push(panel('Lỗi', h('pre', {}, e.message))); return out; }
    for (const phase of ['baseline', 'shadow', 'assist']) {
      const ss = r.slices.filter((s) => s.phase === phase);
      if (!ss.length) continue;
      out.push(panel(`Phase: ${phase}`, table(['Slice', 'Fix rounds', 'Review rounds', 'Lặp lại', 'Hook', 'Token đưa vào', 'Verdict u/r/i/m/s', 'Cited', 'Deviation'], ss.map((s) => h('tr', {},
        h('td', {}, h('b', {}, s.slice)), h('td', {}, s.fix_rounds ?? '—'), h('td', {}, s.review_rounds ?? '—'), h('td', {}, s.recurring.length),
        h('td', {}, s.memory.hook_calls), h('td', {}, s.memory.injected_tokens),
        h('td', {}, `${s.verdicts.useful}/${s.verdicts.redundant}/${s.verdicts.irrelevant}/${s.verdicts.misleading}/${s.verdicts.stale}`, s.unjudged_items ? h('div', { class: 'muted small' }, `${s.unjudged_items} chưa judge`) : null),
        h('td', {}, s.cited_ids.length ? h('details', {}, h('summary', {}, s.cited_ids.length), s.cited_ids.map((c) => h('div', { class: 'mono small' }, c))) : '0'),
        h('td', {}, s.deviations.length ? h('details', {}, h('summary', {}, s.deviations.length), s.deviations.map((d) => h('div', { class: 'small', style: 'margin:4px 0' }, d))) : ''))))));
    }
    if (r.missing_accounting?.length) out.push(panel('Thiếu số liệu', h('details', {}, h('summary', {}, `${r.missing_accounting.length} mục`), h('ul', {}, r.missing_accounting.map((x) => h('li', { class: 'small' }, x))))));
    return out;
  },

  async playbook() {
    const pb = await api('/api/playbook');
    const q = h('input', { placeholder: 'tìm recipe (id, tóm tắt, tag, dự án nguồn)', class: 'grow', value: state.recipeQ, oninput: (e) => { state.recipeQ = e.target.value; drawList(); } });
    const list = h('tbody');
    const drawList = () => {
      const n = state.recipeQ.toLowerCase();
      list.replaceChildren(...pb.recipes.filter((r) => !n || JSON.stringify([r.id, r.summary, r.tags, r.source_project]).toLowerCase().includes(n)).map((r) => h('tr', { class: 'click', onclick: async () => { state.recipe = await api(`/api/recipe?path=${encodeURIComponent(r.path)}`); render(); } },
        h('td', { class: 'mono' }, r.id), h('td', {}, chip(r.status, r.status === 'stable' ? 'ok' : '')), h('td', {}, r.summary), h('td', { class: 'small' }, (r.tags ?? []).join(', ')), h('td', { class: 'small' }, r.source_project ?? ''), h('td', {}, (r.reuses ?? []).length))));
    };
    drawList();
    const out = [panel(['Recipe ', chip(pb.recipes.length)], h('div', { class: 'row' }, q), h('table', {}, h('thead', {}, h('tr', {}, ['Id', 'Trạng thái', 'Tóm tắt', 'Tag', 'Nguồn', 'Dùng lại'].map((x) => h('th', {}, x)))), list))];
    if (state.recipe) out.unshift(panel(['Recipe: ', h('span', { class: 'mono' }, state.recipe.path), h('button', { class: 'act', onclick: () => { state.recipe = null; render(); } }, 'Đóng')], h('pre', {}, state.recipe.text)));
    if (pb.kits) out.push(panel('Kits', h('pre', {}, JSON.stringify(pb.kits, null, 2))));
    return out;
  },

  async scorecard() {
    return [panel('Workflow scorecard', h('p', { class: 'muted small' }, 'Bản dashboard mới nhất do job scorecard 09:17 tạo.'), h('iframe', { src: `/scorecard?t=${encodeURIComponent(T)}`, sandbox: 'allow-scripts' }))];
  },

  async log() {
    const a = await api('/api/actions');
    return [panel('Thao tác đã chạy từ console', a.log.length ? table(['Lúc', 'Thao tác', 'Kết quả', 'Chi tiết'], a.log.map((r) => h('tr', {}, h('td', { class: 'small' }, when(r.at)), h('td', { class: 'mono' }, r.action), h('td', {}, chip(r.code === 0 ? 'ok' : `exit ${r.code}`, r.code === 0 ? 'ok' : 'bad')),
      h('td', {}, h('details', {}, h('summary', {}, JSON.stringify(r.body).slice(0, 90)), h('pre', {}, JSON.stringify(r, null, 1))))))) : empty('Chưa có thao tác nào.'),
      h('p', { class: 'muted small' }, `Được phép: ${a.actions.join(', ')}. Mọi thao tác chạy đúng CLI của hệ thống tương ứng.`))];
  },
};

// ------------------------------------------------------------------ cards
function questionCard(q) {
  const note = h('textarea', { placeholder: 'ghi chú / câu trả lời cho lane (bắt buộc với lựa chọn có dấu *)' });
  return h('div', { class: 'card' },
    h('div', { class: 'row' }, h('b', {}, q.project), chip(q.slice ?? '—'), chip(q.kind, 'warn'), h('span', { class: 'muted small' }, `${q.id} · ${when(q.asked_at)}`)),
    h('pre', {}, q.text),
    q.detail && q.detail !== q.text ? h('details', {}, h('summary', {}, 'Chi tiết'), h('pre', {}, q.detail)) : null,
    note,
    h('div', { class: 'row', style: 'margin-top:6px' }, q.options.map((o) => h('button', {
      class: 'act', title: o.note === 'required' ? 'cần ghi chú' : '',
      onclick: () => {
        if (o.note === 'required' && !note.value.trim()) return toast('Lựa chọn này cần ghi chú.', true);
        act('runner.answer', { project: q.project, id: q.id, choice: o.choice, text: note.value }, `${q.project} ${q.id}: "${o.choice}"?`);
      },
    }, o.choice + (o.note === 'required' ? ' *' : '')))));
}

function draftCard(d) {
  const rows = d.rows.map((r) => {
    const sel = h('select', {}, h('option', { value: '' }, '—'), ['useful', 'redundant', 'irrelevant', 'misleading', 'stale'].map((v) => h('option', { value: v, selected: v === r.verdict }, v)));
    const ok = h('input', { type: 'checkbox', checked: !!r.confirmed });
    return { r, sel, ok, tr: h('tr', {}, h('td', {}, r.stage), h('td', { class: 'mono small' }, r.record), h('td', {}, sel), h('td', {}, r.confidence ? chip(r.confidence, r.confidence === 'low' ? 'warn' : '') : ''), h('td', { class: 'small' }, r.evidence ?? ''), h('td', {}, ok)) };
  });
  return h('div', { class: 'card' },
    h('div', { class: 'row' }, h('b', {}, `${d.project} ${d.slice}`), h('span', { class: 'muted small' }, `soạn ${when(d.created_at)} bởi ${d.model}`)),
    table(['Stage', 'Record', 'Verdict', 'Tin cậy', 'Bằng chứng', 'Xác nhận'], rows.map((x) => x.tr)),
    h('div', { class: 'row', style: 'margin-top:6px' },
      h('button', { class: 'act', onclick: () => rows.forEach((x) => { if (x.sel.value) x.ok.checked = true; }) }, 'Chọn tất cả dòng có verdict'),
      h('button', { class: 'act primary', onclick: () => {
        const edits = rows.map((x) => ({ stage: x.r.stage, record: x.r.record, verdict: x.sel.value || null, confirmed: x.ok.checked && !!x.sel.value }));
        const n = edits.filter((e) => e.confirmed).length;
        if (!n) return toast('Chưa xác nhận dòng nào.', true);
        act('draft.apply', { file: d.file, rows: edits }, `Ghi ${n} verdict của ${d.project} ${d.slice} vào ledger?`);
      } }, 'Ghi các dòng đã xác nhận')));
}

function triageCard(t) {
  const note = h('input', { placeholder: 'lý do bỏ qua (bắt buộc)', class: 'grow' });
  return h('div', { class: 'card' }, h('div', { class: 'mono small' }, t.source), h('div', {}, t.reason),
    h('div', { class: 'row', style: 'margin-top:6px' }, note, h('button', { class: 'act', onclick: () => act('triage.dismiss', { source: t.source, note: note.value }, `Bỏ qua dòng triage này?\n${t.source}\n(áp dụng ở lần refresh tiếp theo)`) }, 'Bỏ qua')));
}

async function projectView(id) {
  const d = await api(`/api/project?id=${encodeURIComponent(id)}`);
  const stopAfter = h('input', { placeholder: 'S09', size: 5 });
  const controls = d.runner ? h('div', { class: 'row' },
    ['pause', 'stop', 'clear'].map((c) => h('button', { class: 'act', onclick: () => act('runner.control', { project: id, cmd: c }, `${c} runner của ${id}?`) }, c)),
    stopAfter, h('button', { class: 'act', onclick: () => act('runner.control', { project: id, cmd: 'stop-after', slice: stopAfter.value.trim() }, `Dừng ${id} sau ${stopAfter.value}?`) }, 'stop-after'),
    h('span', { class: 'muted small' }, d.runner.lock ? `lock pid ${d.runner.lock.pid} từ ${when(d.runner.lock.started_at)}` : 'không có lock')) : h('div', { class: 'muted' }, 'Dự án này không dùng game-producer runner.');
  const slices = table(['Slice', 'Trạng thái', 'Fix/Review', 'Memory', 'Merge journal', 'Hoãn'], d.slices.map((s) => h('tr', {},
    h('td', {}, h('b', {}, s.slice), s.file ? h('div', { class: 'muted small mono' }, s.file) : null),
    h('td', {}, s.status ? chip(s.status, s.status === 'merged' || s.status === 'shipped' ? 'ok' : s.status === 'in_progress' ? 'warn' : '') : '—', s.handoff ? h('div', { class: 'muted small' }, `${s.handoff.role ?? ''} ${s.handoff.status ?? ''}`) : null),
    h('td', {}, `${s.fix_rounds ?? '—'} / ${s.review_rounds ?? '—'}`),
    h('td', {}, s.memory ? [chip(s.memory.phase ?? '—', modeCls(s.memory.phase)), h('div', { class: 'small' }, `pack ${s.memory.packs} · cited ${s.memory.cited.length}${s.memory.unjudged ? ` · ${s.memory.unjudged} chưa judge` : ''}`)] : '—'),
    h('td', {}, s.merge ? h('details', {}, h('summary', {}, `${Object.keys(s.merge).length} bước`), Object.entries(s.merge).map(([k, v]) => h('div', { class: 'small' }, h('b', {}, k), ': ', v))) : '—'),
    h('td', {}, s.manual_deferred.length || ''))));
  const terms = d.terminals.length ? d.terminals.map((t) => h('div', { class: 'card' }, h('div', { class: 'row' }, h('b', {}, t.title ?? t.handle), t.agent ? chip(t.agent) : null, chip(t.connected ? 'kết nối' : 'mất kết nối', t.connected ? 'ok' : 'bad'), h('span', { class: 'muted small mono' }, t.handle)),
    h('div', { class: 'muted small mono' }, t.worktree), h('pre', {}, t.preview || '(trống)'))) : empty('Không có terminal Orca nào của dự án này.');
  return panel([`${d.id} `, d.mode ? chip(d.mode, modeCls(d.mode)) : null, h('button', { class: 'act', onclick: () => { location.hash = 'workflow'; } }, 'Đóng')],
    h('div', { class: 'muted small mono' }, d.path), d.release ? h('div', { class: 'small' }, `release.goal ${d.release.goal ?? '—'} · current_slice ${d.release.current_slice || '—'}`) : null,
    h('h2', { style: 'margin-top:12px' }, 'Điều khiển runner'), controls,
    h('h2', { style: 'margin-top:12px' }, 'Slices'), slices,
    h('h2', { style: 'margin-top:12px' }, 'Terminal'), terms);
}

async function recordsPanel() {
  const q = h('input', { placeholder: 'tìm record (id, nội dung, topic)', class: 'grow', value: state.recordQ });
  const proj = h('select', {}, h('option', { value: '' }, 'mọi dự án'), Object.keys((await api('/api/memory')).archive.by_project).map((p) => h('option', { value: p, selected: p === state.recordProject }, p)));
  const results = h('div');
  const search = async () => {
    state.recordQ = q.value; state.recordProject = proj.value;
    const rs = await api(`/api/records?q=${encodeURIComponent(q.value)}&project=${encodeURIComponent(proj.value)}`);
    results.replaceChildren(rs.length ? table(['Record', 'Kind', 'Topic', 'Lifecycle', 'Nội dung'], rs.map((r) => h('tr', { class: 'click', onclick: async () => { state.record = await api(`/api/record?id=${encodeURIComponent(r.record_id)}`); render(); } },
      h('td', { class: 'mono small' }, r.record_id), h('td', {}, r.kind), h('td', {}, r.topic), h('td', {}, chip(r.lifecycle, r.lifecycle === 'active' ? 'ok' : '')), h('td', { class: 'small' }, r.claim)))) : empty('Không tìm thấy.'));
  };
  q.addEventListener('keydown', (e) => { if (e.key === 'Enter') search(); });
  const out = panel('Tìm record', h('div', { class: 'row' }, q, proj, h('button', { class: 'act', onclick: search }, 'Tìm')), results);
  if (state.recordQ || state.recordProject) search();
  if (state.record) {
    const r = state.record;
    const to = h('input', { placeholder: 'nơi bài học đang nằm (file:dòng)', class: 'grow' });
    const note = h('input', { placeholder: 'lý do (bắt buộc)', class: 'grow' });
    out.prepend(h('div', { class: 'card' },
      h('div', { class: 'row' }, h('b', { class: 'mono' }, r.record_id), chip(`r${r.revision}`), chip(r.lifecycle, r.lifecycle === 'active' ? 'ok' : 'warn'), chip(r.kind), chip(r.topic), h('button', { class: 'act', onclick: () => { state.record = null; render(); } }, 'Đóng')),
      h('pre', {}, r.claim), r.conditions?.length ? h('div', { class: 'small' }, 'Điều kiện: ', r.conditions.join(' · ')) : null,
      r.limitations?.length ? h('div', { class: 'small' }, 'Giới hạn: ', r.limitations.join(' · ')) : null,
      r.promoted_to ? h('div', { class: 'small' }, 'Đã promote tới: ', r.promoted_to) : null,
      h('details', {}, h('summary', {}, 'Nguồn và toàn bộ record'), h('pre', {}, JSON.stringify(r, null, 2))),
      r.lifecycle === 'active' ? h('div', { class: 'row', style: 'margin-top:6px' }, to, note,
        h('button', { class: 'act', onclick: () => act('memory.promote', { record: r.record_id, to: to.value, note: note.value }, `Promote ${r.record_id}? Record sẽ rời khỏi pack sau lần refresh tiếp theo.`) }, 'Promote'),
        h('button', { class: 'act', onclick: () => act('memory.retract', { record: r.record_id, note: note.value }, `Retract ${r.record_id}? (bài học SAI)`) }, 'Retract')) : null));
  }
  return out;
}

// ------------------------------------------------------------------ boot
window.addEventListener('hashchange', () => { fromHash(); render(); });
render();
setInterval(() => { if (!document.hidden && ['pending', 'workflow'].includes(tab) && !document.activeElement?.matches('input, textarea, select')) render(); }, 20000);
</script>
</body>
